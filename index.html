<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVA — практика 1</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font: 18px/1.6 system-ui, sans-serif;
      color: #1d1d1f;
      background: #f5f5f7;
    }
    main {
      max-width: 560px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 24px;
    }
    h1 { font-size: 32px; line-height: 1.15; }
    button {
      min-height: 44px;
      padding: 12px 20px;
      border: 0;
      border-radius: 24px;
      font: inherit;
      color: white;
      background: #0066cc;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <p>NOVA</p>
    <h1>Будущее начинается сегодня</h1>
    <p>Мой сайт, созданный на iPhone.</p>
    <button id="more" type="button"
      aria-controls="details" aria-expanded="false">Подробнее</button>
    <p id="details" hidden>
      Здесь можно рассказать о продукте или услуге.
    </p>
  </main>
  <script>
    const button = document.querySelector("#more");
    const details = document.querySelector("#details");

    button.addEventListener("click", () => {
      details.hidden = !details.hidden;
      button.textContent = details.hidden ? "Подробнее" : "Скрыть";
      button.setAttribute("aria-expanded", String(!details.hidden));
    });
  </script>
</body>
</html>
